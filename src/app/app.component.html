<!-- ====================================================================================
     MASTER APPLICATION SHELL LAYOUT
     ==================================================================================== -->
<div class="app-layout">
  <!-- Top Navigation Header -->
  <app-navbar (toggleSidebar)="toggleSidebar()"></app-navbar>

  <div class="app-body">
    <!-- Responsive Adaptive Sidebar Drawer -->
    <app-sidebar [isOpen]="isSidebarOpen()" (closeSidebar)="closeSidebar()"></app-sidebar>

    <!-- Main Dynamic Route Viewport -->
    <main class="main-content-viewport" id="main-content" role="main">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Global Floating Toast Notification Container -->
  <app-toast></app-toast>
</div>
